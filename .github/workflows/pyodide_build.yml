name: Emscripten/Pyodide build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-wasm-emscripten:
    permissions:
      contents: read # to fetch code (actions/checkout)
    name: Build moleculekit distribution for Pyodide
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a # 3.4.0
        env:
          CIBW_PLATFORM: pyodide
          CIBW_TEST_SKIP: "*pyodide*"
          # The two Pyodide runtimes we currently publish (2024_0 and 2025_0).
          # Pinned because requires-python no longer has an upper bound, so
          # cibuildwheel would otherwise add the cp314 runtime we have not validated.
          # Widen deliberately when adopting a new runtime; if a pinned one
          # disappears the upload step fails on if-no-files-found.
          CIBW_BUILD: "cp312-pyodide* cp313-pyodide*"
          # Pyodide ships one interpreter per runtime, so a Stable ABI wheel buys
          # nothing here. Keep emitting the version-specific wheel this job has
          # always produced rather than an abi3-tagged one. See setup.py.
          CIBW_ENVIRONMENT: MOLECULEKIT_DISABLE_STABLE_ABI=1
          # Force the version to avoid setuptools_scm producing a
          # .dev0+g<sha>.d<date> local version when the tree is detected
          # as dirty during the build.
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MOLECULEKIT: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload wheel artifact(s)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyodide_wasm32
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  upload-wheels:
    name: Upload WASM wheels to Anaconda
    runs-on: ubuntu-22.04
    permissions: {}
    needs: [build-wasm-emscripten]

    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: ../deploy-env
          python-version: "3.13"

      - name: Install anaconda-client
        shell: bash -l {0}
        run: |
          conda install anaconda-client -c conda-forge

      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: "*_wasm32"
          path: dist/
          merge-multiple: true

      - name: Upload wheel to conda
        shell: bash -l {0}
        run: |
          anaconda -t ${{ secrets.ANACONDA_TOKEN_BASIC }} upload -u acellera dist/moleculekit-*.whl
