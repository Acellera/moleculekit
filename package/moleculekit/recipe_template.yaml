package:
  name: moleculekit
  version:

source:
  path: ../..

build:
  python:
    # The extensions are built against the CPython Stable ABI, so a single package
    # per platform serves every supported Python rather than one package per
    # version. The python list in variants.yaml therefore holds only the version
    # we compile against, which must stay in step with the run constraint below
    # and with requires-python in pyproject.toml.
    version_independent: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - cython >=0.29.21
    - pip
    - python
    - setuptools
    - python-build
    - setuptools-scm>=8
    - numpy >=2.0.0rc1
  run:
    - python >=3.11

tests:
  - python:
      imports:
        - moleculekit
      pip_check: false

about:
  homepage: https://software.acellera.com/moleculekit/
  license: LicenseRef-HTMD
  license_file: LICENSE
  summary: A molecule reading/writing and manipulation package.

extra:
  recipe-maintainers:
    - stefdoerr
